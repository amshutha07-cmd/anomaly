name: Crypto anomaly monitoring cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: crypto-monitor-cycle
  cancel-in-progress: false

jobs:
  monitor-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HOSTED_API_BASE_URL: ${{ secrets.HOSTED_API_BASE_URL }}
      ALERT_WORKER_TOKEN: ${{ secrets.ALERT_WORKER_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run one bounded monitoring cycle
        run: python hosted/api/tools/scheduled_cycle.py
